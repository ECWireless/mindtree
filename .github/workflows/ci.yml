name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Release verification
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337
        env:
          POSTGRES_DB: mindtree
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mindtree"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ALLOWED_EMAIL: browser-user@example.test
      BETTER_AUTH_SECRET: synthetic-auth-secret-for-ci-verification
      BETTER_AUTH_URL: http://127.0.0.1:3188
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mindtree
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/mindtree
      GOOGLE_CLIENT_ID: synthetic-google-client-id
      GOOGLE_CLIENT_SECRET: synthetic-google-client-secret
      SHARE_LINK_ENCRYPTION_KEY: Dw8PDw8PDw8PDw8PDw8PDw8PDw8PDw8PDw8PDw8PDw8

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0

      - name: Install compatible Corepack
        run: |
          npm install --global corepack@0.34.6 --ignore-scripts
          corepack enable
          corepack --version
          corepack pnpm --version

      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Check migration consistency
        run: corepack pnpm db:check

      - name: Migrate synthetic database
        run: corepack pnpm db:migrate

      - name: Lint
        run: corepack pnpm lint

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Run unit tests
        run: corepack pnpm test

      - name: Run integration tests
        run: corepack pnpm test:integration

      - name: Build production application
        run: corepack pnpm build

      - name: Run deterministic evaluation fixtures
        run: corepack pnpm test:eval:fixtures

      - name: Install Chromium
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: corepack pnpm test:e2e
